# Checks Rate Watch targets against today's rates and sends hits to Zapier.
# Runs automatically right after "Update mortgage rates" finishes, so it always
# compares against the freshest rates.json (GitHub often starts scheduled jobs
# hours late, so a fixed clock time could run before the rates were updated).
# It can also be run by hand from the Actions tab.
name: Rate Watch alerts
on:
  workflow_run:
    workflows: ["Update mortgage rates"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Compare targets with today's rates
        env:
          WATCHERS_CSV_URL: ${{ secrets.WATCHERS_CSV_URL }}
          ZAPIER_HOOK_URL: ${{ secrets.ZAPIER_HOOK_URL }}
        run: python3 rate_watch.py
