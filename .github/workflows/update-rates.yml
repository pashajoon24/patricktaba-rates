name: Update mortgage rates

on:
  schedule:
    - cron: "0 21 * * *"   # every day at 2pm Pacific; only saves when Freddie Mac has a new week
  workflow_dispatch:       # adds a "Run workflow" button for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest weekly averages
        run: python3 update_rates.py
      - name: Save rates.json if it changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update mortgage rates" && git push)
